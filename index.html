<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal de Telemedicina - Projeto Educacional</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            medical: {
              50: '#f0f9ff', 100: '#e0f2fe', 500: '#0ea5e9', 600: '#0284c7', 700: '#0369a1', 800: '#075985', 900: '#0c4a6e',
            }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen flex flex-col font-sans">

  <!-- TOP HEADER NAVBAR RESPONSIVO -->
  <header class="bg-slate-900 text-white shadow-md sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <div class="bg-medical-500 text-white p-2 rounded-lg flex items-center justify-center">
          <i class="fa-solid fa-hospital-user text-xl"></i>
        </div>
        <div>
          <h1 class="text-base sm:text-lg font-bold tracking-tight">Portal Saúde Digital</h1>
          <p class="text-[10px] sm:text-xs text-slate-400">Etapa 1 - Calouros de Medicina</p>
        </div>
      </div>

      <!-- Navigation Switcher Buttons -->
      <nav class="hidden md:flex items-center space-x-2">
        <button onclick="switchModule('guia')" id="nav-btn-guia" class="px-3 py-1.5 rounded-lg text-xs font-semibold bg-medical-600 text-white transition flex items-center gap-1.5 shadow">
          <i class="fa-solid fa-book-open"></i> Guia Teórico &amp; Didático
        </button>
        <button onclick="switchModule('prototipo')" id="nav-btn-prototipo" class="px-3 py-1.5 rounded-lg text-xs font-semibold bg-slate-800 text-slate-300 hover:bg-slate-700 transition flex items-center gap-1.5">
          <i class="fa-solid fa-laptop-code"></i> Protótipo Síncrono P2P
        </button>
      </nav>

      <!-- Mobile Hamburger / Actions -->
      <div class="flex md:hidden items-center gap-2">
        <button onclick="toggleMobileMenu()" class="p-2 rounded-lg bg-slate-800 text-slate-200">
          <i class="fa-solid fa-bars text-lg"></i>
        </button>
      </div>
    </div>

    <!-- Mobile Dropdown Menu -->
    <div id="mobile-menu" class="hidden md:hidden bg-slate-800 px-4 py-3 border-t border-slate-700 space-y-2">
      <button onclick="switchModule('guia'); toggleMobileMenu();" class="w-full text-left px-3 py-2 rounded-lg text-xs font-semibold bg-medical-600 text-white flex items-center gap-2">
        <i class="fa-solid fa-book-open"></i> Guia Teórico &amp; Didático
      </button>
      <button onclick="switchModule('prototipo'); toggleMobileMenu();" class="w-full text-left px-3 py-2 rounded-lg text-xs font-semibold bg-slate-700 text-slate-200 flex items-center gap-2">
        <i class="fa-solid fa-laptop-code"></i> Protótipo Síncrono P2P
      </button>
    </div>
  </header>

  <!-- CONTENT CONTAINER (IFRAMES OR EMBEDDED VIEW) -->
  <main class="flex-1 w-full flex flex-col">
    <!-- Module 1: Guia Teórico -->
    <iframe id="frame-guia" src="guia_interativo_de_telemedicina.html" class="w-full flex-1 border-0 min-h-[calc(100vh-4rem)]"></iframe>
    <!-- Module 2: Protótipo Prático Síncrono -->
    <iframe id="frame-prototipo" src="plataforma_de_telemedicina_s_ncrona.html" class="w-full flex-1 border-0 hidden min-h-[calc(100vh-4rem)]"></iframe>
  </main>

  <script>
    function switchModule(module) {
      const frameGuia = document.getElementById('frame-guia');
      const frameProto = document.getElementById('frame-prototipo');
      const btnGuia = document.getElementById('nav-btn-guia');
      const btnProto = document.getElementById('nav-btn-prototipo');

      if (module === 'guia') {
        frameGuia.classList.remove('hidden');
        frameProto.classList.add('hidden');
        btnGuia.className = "px-3 py-1.5 rounded-lg text-xs font-semibold bg-medical-600 text-white transition flex items-center gap-1.5 shadow";
        btnProto.className = "px-3 py-1.5 rounded-lg text-xs font-semibold bg-slate-800 text-slate-300 hover:bg-slate-700 transition flex items-center gap-1.5";
      } else {
        frameGuia.classList.add('hidden');
        frameProto.classList.remove('hidden');
        btnProto.className = "px-3 py-1.5 rounded-lg text-xs font-semibold bg-medical-600 text-white transition flex items-center gap-1.5 shadow";
        btnGuia.className = "px-3 py-1.5 rounded-lg text-xs font-semibold bg-slate-800 text-slate-300 hover:bg-slate-700 transition flex items-center gap-1.5";
      }
    }

    function toggleMobileMenu() {
      const menu = document.getElementById('mobile-menu');
      menu.classList.toggle('hidden');
    }
  </script>
</body>
</html>
